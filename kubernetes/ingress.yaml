apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: ai-devsecops-ingress
  annotations:

spec:
  ingressClassName: traefik

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: ai-devsecops-service
                port:
                  number: 5000
