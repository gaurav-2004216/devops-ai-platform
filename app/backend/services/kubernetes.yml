apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-devsecops-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ai-devsecops-backend

  template:
    metadata:
      labels:
        app: ai-devsecops-backend

    spec:
      containers:
      - name: backend
        image: gaurav262004/ai-devsecops-backend:15

        ports:
        - containerPort: 5000


---

apiVersion: v1
kind: Service

metadata:
  name: ai-devsecops-service

spec:
  type: NodePort

  selector:
    app: ai-devsecops-backend

  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30080
